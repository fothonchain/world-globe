# Publish World Globe to GitHub Pages with fresh news: fetch the RSS feeds, write public/data/world.json, deploy public/.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may run scheduled jobs a few minutes late)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: node test/geo.test.js && python3 test/server_test.py
      - name: Fetch the news
        run: python3 scripts/build_feed.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
